services:
  # 1. MongoDB (Primary Database)
  mongodb:
    image: mongo:latest
    container_name: welookup-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # These must match the strings used in your connection URIs
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INIT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INIT_PASSWORD}
    volumes:
      - mongodb_data:/data/db

  # 2. RabbitMQ (Message Broker)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: welookup-rabbitmq
    restart: always
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Verification Service
  verification-service:
    build:
      context: ./backend-services/verification-service
    container_name: welookup-verification-service
    restart: always
    env_file:
      - ./backend-services/verification-service/.env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # 4. API Gateway
  api-gateway:
    build:
      context: ./backend-services/api-gateway
    container_name: welookup-api-gateway
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend-services/api-gateway/.env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # 5. Scoring Service
  scoring-service:
    build:
      context: ./backend-services/scoring-service
    container_name: welookup-scoring-service
    restart: always
    env_file:
      - ./backend-services/scoring-service/.env
    depends_on:
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb_data:
